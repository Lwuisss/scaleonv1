      <stop offset="0%" stop-color="#ff8a4c"/>
      <stop offset="50%" stop-color="#e86328"/>
      <stop offset="100%" stop-color="#c43f0e"/>
    </linearGradient>
    <linearGradient id="scGradLight" x1="0%" y1="100%" x2="100%" y2="0%">
